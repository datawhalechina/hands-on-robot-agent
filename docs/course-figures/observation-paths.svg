<svg xmlns="http://www.w3.org/2000/svg" width="640" height="332" viewBox="0 0 640 332">
<title>同一个场景的两条观测路径</title>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#41574e"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#09614e"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#a3362e"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#24517d"/></marker>
</defs>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="638" height="330" rx="18" fill="#f5f8f5" stroke="#d5ded7"/>
<rect x="24" y="20" width="592" height="55" rx="12" fill="#e0f0e7" stroke="#96c6b1"/>
<text x="320.0" y="55.5" text-anchor="middle" font-size="23" font-weight="680" fill="#09614e">MuJoCo 中的同一个场景</text>
<polyline points="168,82 168,111" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<polyline points="472,82 472,111" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<rect x="24" y="118" width="288" height="76" rx="12" fill="#e5edf8" stroke="#a8bdd7"/>
<text x="168.0" y="152.0" text-anchor="middle" font-size="23" font-weight="680" fill="#24517d">直接读取状态</text>
<text x="168.0" y="178.0" text-anchor="middle" font-size="20" font-weight="500" fill="#24517d">关节、方块、目标位置</text>
<rect x="328" y="118" width="288" height="76" rx="12" fill="#faf0d9" stroke="#d4b776"/>
<text x="472.0" y="152.0" text-anchor="middle" font-size="23" font-weight="680" fill="#77520c">相机渲染 RGB</text>
<text x="472.0" y="178.0" text-anchor="middle" font-size="20" font-weight="500" fill="#77520c">经颜色与标定估计位置</text>
<polyline points="168,202 168,229" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<polyline points="472,202 472,229" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<rect x="24" y="236" width="288" height="76" rx="12" fill="#ffffff" stroke="#cad8d0"/>
<text x="168.0" y="270.0" text-anchor="middle" font-size="23" font-weight="680" fill="#192c26">第 3、6 章主线</text>
<text x="168.0" y="296.0" text-anchor="middle" font-size="20" font-weight="500" fill="#192c26">反馈控制读取坐标</text>
<rect x="328" y="236" width="288" height="76" rx="12" fill="#ffffff" stroke="#cad8d0"/>
<text x="472.0" y="270.0" text-anchor="middle" font-size="23" font-weight="680" fill="#192c26">第 8 章独立练习</text>
<text x="472.0" y="296.0" text-anchor="middle" font-size="20" font-weight="500" fill="#192c26">估计与真值比较</text>
</g></svg>
