<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330">
<title>同一次抓空后的两条执行轨迹</title>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#41574e"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#09614e"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#a3362e"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#24517d"/></marker>
</defs>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="638" height="328" rx="18" fill="#f5f8f5" stroke="#d5ded7"/>
<rect x="24" y="22" width="592" height="62" rx="12" fill="#fbe9e6" stroke="#e1aaa2"/>
<text x="320.0" y="61.0" text-anchor="middle" font-size="23" font-weight="680" fill="#a3362e">第 3 次调用抓空，holding = false</text>
<polyline points="164,91 164,115" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<polyline points="476,91 476,115" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<rect x="24" y="122" width="289" height="67" rx="12" fill="#faf0d9" stroke="#d4b776"/>
<text x="168.5" y="151.5" text-anchor="middle" font-size="23" font-weight="680" fill="#77520c">固定脚本</text>
<text x="168.5" y="177.5" text-anchor="middle" font-size="20" font-weight="500" fill="#77520c">第 4 次调用：抬手</text>
<rect x="327" y="122" width="289" height="67" rx="12" fill="#e0f0e7" stroke="#96c6b1"/>
<text x="471.5" y="151.5" text-anchor="middle" font-size="23" font-weight="680" fill="#09614e">规则闭环</text>
<text x="471.5" y="177.5" text-anchor="middle" font-size="20" font-weight="500" fill="#09614e">第 4 次调用：再抓</text>
<polyline points="164,198 164,225" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<polyline points="476,198 476,225" fill="none" stroke="#41574e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<rect x="24" y="232" width="289" height="75" rx="12" fill="#fbe9e6" stroke="#e1aaa2"/>
<text x="168.5" y="265.5" text-anchor="middle" font-size="23" font-weight="680" fill="#a3362e">走完整个序列</text>
<text x="168.5" y="291.5" text-anchor="middle" font-size="20" font-weight="500" fill="#a3362e">松手时夹爪仍为空</text>
<rect x="327" y="232" width="289" height="75" rx="12" fill="#e0f0e7" stroke="#96c6b1"/>
<text x="471.5" y="265.5" text-anchor="middle" font-size="23" font-weight="680" fill="#09614e">抓稳后继续搬运</text>
<text x="471.5" y="291.5" text-anchor="middle" font-size="20" font-weight="500" fill="#09614e">释放后通过验收</text>
</g></svg>
